<html lang="it" class="h-full">

    <style>

                        <button onclick="execCmd('strikeThrough')" title="Barrato" class="fmt-btn line-through">S</button>

                        <button onclick="execCmd('insertOrderedList')" title="Numerato" class="fmt-btn">123</button>
                    </div>

                    <div class="flex items-center gap-1">
                        <button onclick="execCmd('justifyLeft')" title="Sinistra" class="fmt-btn">

                        </button>
                        <button onclick="execCmd('justifyCenter')" title="Centro" class="fmt-btn">

        <div id="screen-library" class="fixed inset-0 bg-darkBg/95 backdrop-blur-lg z-40 flex flex-col p-4 transition-all duration-300 transform translate-x-full">
            <div class="flex items-center justify-between pb-3 border-b border-white/10">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-neonGreen" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    I miei Writs
                </h2>
                <button onclick="toggleLibrary()" class="bg-cardDark text-gray-300 p-2 rounded-full border border-white/10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>

                <div class="space-y-1.5">
                    <span class="text-xs font-bold text-gray-300 uppercase tracking-wider">Key Points</span>
                    <div id="summary-text" class="bg-btnDark border border-white/10 rounded-xl p-3 text-xs text-gray-300 max-h-48 overflow-y-auto leading-relaxed"></div>
                </div>

                <button onclick="closeSummaryModal()" class="w-full bg-btnSlate text-white font-bold text-xs py-2.5 rounded-xl border border-white/10">

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-btnSlate border border-neonGreen/50 text-white px-4 py-2 rounded-full text-xs shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50">
        Notifica
    </div>

    <script>
        const DB_NAME = 'iPhoneWordDocsDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'documents';
        let db = null;
        let currentDocId = null;
        let saveTimeout = null;
        let pageCount = 1;

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                req.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                req.onerror = (e) => reject(e);
            });
        }

        function getAllDocs() {
            return new Promise((resolve) => {
                if (!db) return resolve([]);
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
            });
        }

        function saveDocToDB(doc) {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put(doc);
                tx.oncomplete = () => resolve();
            });
        }

        function deleteDocFromDB(id) {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(id);
                tx.oncomplete = () => resolve();
            });
        }

        async function initApp() {
            await initDB();
            const docs = await getAllDocs();
            if (docs.length === 0) {
                await createNewDocument();
            } else {
                docs.sort((a,b) => b.updatedAt - a.updatedAt);
                openDocument(docs[0].id);
            }
        }

        async function createNewDocument() {
            const newDoc = {
                id: Date.now().toString(),
                title: 'Nuovo Writs',
                pages: ['<p>Inizia qui a scrivere il tuo Writs!</p>'],
                updatedAt: Date.now()
            };
            await saveDocToDB(newDoc);
            await openDocument(newDoc.id);
            toggleLibrary(false);
            showToast("Nuovo writs creato");
        }

        async function openDocument(id) {
            currentDocId = id;
            const docs = await getAllDocs();
            const doc = docs.find(d => d.id === id);
            if (!doc) return;

            document.getElementById('doc-title').value = doc.title || '';
            const container = document.getElementById('pages-container');
            container.innerHTML = '';

            const pages = doc.pages && doc.pages.length > 0 ? doc.pages : [''];
            pageCount = pages.length;

            pages.forEach((content, index) => {
                const pageNum = index + 1;
                const pageWrapper = document.createElement('div');
                pageWrapper.className = 'space-y-2';
                pageWrapper.innerHTML = `
                    <div class="flex justify-between items-center px-2">
                        <span class="text-[10px] text-gray-500 font-mono">PAGINA ${pageNum} DI ${pageCount}</span>
                        ${index === pages.length - 1 ? `
                            <button onclick="addNewPage()" class="text-xs text-neonGreen font-bold flex items-center gap-1 bg-cardDark border border-white/10 px-2.5 py-1 rounded-xl active:scale-95 transition">
                                + Nuova Pagina
                            </button>
                        ` : ''}
                    </div>
                    <div id="editor-page-${pageNum}" class="doc-page" contenteditable="true" oninput="onDocInput()">${content}</div>
                `;
                container.appendChild(pageWrapper);
            });

            updateDocStats();
            toggleLibrary(false);
        }

        function addNewPage() {
            pageCount++;
            const container = document.getElementById('pages-container');
            const pageWrapper = document.createElement('div');
            pageWrapper.className = 'space-y-2 pt-2';
            pageWrapper.innerHTML = `
                <div class="flex justify-between items-center px-2">
                    <span class="text-[10px] text-gray-500 font-mono">PAGINA ${pageCount} DI ${pageCount}</span>
                    <button onclick="addNewPage()" class="text-xs text-neonGreen font-bold flex items-center gap-1 bg-cardDark border border-white/10 px-2.5 py-1 rounded-xl active:scale-95 transition">
                        + Nuova Pagina
                    </button>
                </div>
                <div id="editor-page-${pageCount}" class="doc-page" contenteditable="true" oninput="onDocInput()"><p></p></div>
            `;
            container.appendChild(pageWrapper);
            onDocInput();
        }

        function onDocInput() {
            updateDocStats();
            setSaveStatus("aggiorno...", true);
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveCurrentDocImmediate();
            }, 400);
        }

        async function saveCurrentDocImmediate() {
            if (!currentDocId) return;
            const title = document.getElementById('doc-title').value;
            const pages = [];
            for (let i = 1; i <= pageCount; i++) {
                const pageEl = document.getElementById(`editor-page-${i}`);
                if (pageEl) {
                    pages.push(pageEl.innerHTML);
                }
            }

            const doc = {
                id: currentDocId,
                title: title,
                pages: pages,
                updatedAt: Date.now()
            };

            await saveDocToDB(doc);
            setSaveStatus("salvato", false);
        }

        function updateDocStats() {
            let totalWords = 0;
            for (let i = 1; i <= pageCount; i++) {
                const pageEl = document.getElementById(`editor-page-${i}`);
                if (pageEl) {
                    const text = pageEl.innerText.trim();
                    if (text) totalWords += text.split(/\s+/).length;
                }
            }
            document.getElementById('doc-words').innerText = totalWords;
            document.getElementById('doc-pages-count').innerText = pageCount;
        }

        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
            onDocInput();
        }

        function changeFont(fontName) {
            execCmd('fontName', fontName);
        }

        function changeFontSize(size) {
            execCmd('fontSize', size);
        }

        async function toggleLibrary(forceOpen = null) {
            const screen = document.getElementById('screen-library');
            const isOpen = !screen.classList.contains('translate-x-full');
            const shouldOpen = forceOpen !== null ? forceOpen : !isOpen;

            if (shouldOpen) {
                await renderLibraryList();
                screen.classList.remove('translate-x-full');
            } else {
                screen.classList.add('translate-x-full');
            }
        }

        async function renderLibraryList() {
            const container = document.getElementById('library-list');
            const docs = await getAllDocs();
            container.innerHTML = '';

            if (docs.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-500 text-center py-6">Nessun documento salvato.</p>';
                return;
            }

            docs.sort((a,b) => b.updatedAt - a.updatedAt);

            docs.forEach(doc => {
                const title = doc.title.trim() || 'Senza Titolo';
                const dateStr = new Date(doc.updatedAt).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                
                const item = document.createElement('div');
                item.className = `bg-cardDark border ${doc.id === currentDocId ? 'border-neonGreen' : 'border-white/10'} rounded-2xl p-3.5 flex items-center justify-between cursor-pointer active:scale-95 transition`;
                item.onclick = () => openDocument(doc.id);
                item.innerHTML = `
                    <div class="flex flex-col space-y-1 truncate pr-2">
                        <strong class="text-sm font-bold text-white truncate">${escapeHtml(title)}</strong>
                        <span class="text-[10px] font-mono text-gray-400">${dateStr} • ${doc.pages ? doc.pages.length : 1} Pagina/e</span>
                    </div>
                    <button onclick="event.stopPropagation(); deleteDoc('${doc.id}')" class="text-red-400 p-2 hover:bg-white/5 rounded-xl">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                container.appendChild(item);
            });
        }

        async function deleteDoc(id) {
            await deleteDocFromDB(id);
            showToast("Documento eliminato");
            const docs = await getAllDocs();
            if (docs.length > 0) {
                openDocument(docs[0].id);
            } else {
                createNewDocument();
            }
            renderLibraryList();
        }

        function toggleExportMenu() {
            const menu = document.getElementById('export-dropdown');
            menu.classList.toggle('hidden');
        }

        function exportPDF() {
            toggleExportMenu();
            showToast("Generazione PDF...");
            const element = document.createElement('div');
            element.style.padding = '20px';
            element.style.color = '#000000';
            element.style.background = '#ffffff';

            for (let i = 1; i <= pageCount; i++) {
                const p = document.getElementById(`editor-page-${i}`);
                if (p) {
                    const pageDiv = document.createElement('div');
                    pageDiv.style.pageBreakAfter = 'always';
                    pageDiv.innerHTML = p.innerHTML;
                    element.appendChild(pageDiv);
                }
            }

            const title = document.getElementById('doc-title').value || 'documento';
            html2pdf().set({
                margin: 10,
                filename: `${title}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save();
        }

        function exportDOCX() {
            toggleExportMenu();
            let fullHTML = "";
            for (let i = 1; i <= pageCount; i++) {
                const p = document.getElementById(`editor-page-${i}`);
                if (p) fullHTML += p.innerHTML + "<br/><hr/><br/>";
            }
            const title = document.getElementById('doc-title').value || 'documento';
            const blob = new Blob(['\ufeff' + fullHTML], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${title}.doc`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("File Word scaricato!");
        }

        function exportTXT() {
            toggleExportMenu();
            let fullText = "";
            for (let i = 1; i <= pageCount; i++) {
                const p = document.getElementById(`editor-page-${i}`);
                if (p) fullText += p.innerText + "\n\n--- PAGINA ---\n\n";
            }
            const title = document.getElementById('doc-title').value || 'documento';
            const blob = new Blob([fullText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${title}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("File TXT scaricato!");
        }

        function openSummaryModal() {
            let fullText = "";
            for (let i = 1; i <= pageCount; i++) {
                const p = document.getElementById(`editor-page-${i}`);
                if (p) fullText += p.innerText + " ";
            }
            
            const textTrim = fullText.trim();
            const words = textTrim ? textTrim.split(/\s+/).length : 0;
            const chars = textTrim.length;
            const readTime = Math.ceil(words / 200);

            document.getElementById('sum-words').innerText = words;
            document.getElementById('sum-chars').innerText = chars;
            document.getElementById('sum-time').innerText = `${readTime}m`;

            const sentences = textTrim.split(/[.!?]+/).filter(s => s.trim().length > 10);
            let summaryHTML = "";

            if (sentences.length === 0) {
                summaryHTML = "<p>Nessun contenuto sufficiente per generare un riassunto.</p>";
            } else {
                const keyPoints = sentences.slice(0, 4);
                summaryHTML = "<ul class='list-disc pl-4 space-y-1.5'>";
                keyPoints.forEach(pt => {
                    summaryHTML += `<li>${escapeHtml(pt.trim())}.</li>`;
                });
                summaryHTML += "</ul>";
            }

            document.getElementById('summary-text').innerHTML = summaryHTML;
            document.getElementById('modal-summary').classList.remove('hidden');
        }

        function closeSummaryModal() {
            document.getElementById('modal-summary').classList.add('hidden');
        }

        function setSaveStatus(msg, isSaving) {
            const status = document.getElementById('save-status');
            status.innerText = msg;
            if (isSaving) {
                status.classList.add('text-neonGreen');
            } else {
                status.classList.remove('text-neonGreen');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 1800);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = initApp;
    </script>
