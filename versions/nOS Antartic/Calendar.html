<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calendar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        .top-nav {
            position: sticky;
            top: 12px;
            z-index: 100;
            margin-top: 12px;
            margin-bottom: 20px;
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 4px;
            border-radius: 30px;
            display: flex;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: calc(100% - 32px);
            max-width: 400px;
        }

        .nav-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: #8e8e93;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .nav-btn.active {
            background-color: #00FF22;
            color: #000000;
            box-shadow: 0 0 12px rgba(0, 255, 34, 0.35);
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: #1c1c1e;
            border-radius: 20px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .month-title {
            font-size: 17px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .icon-btn {
            background: #2c2c2e;
            border: none;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            margin-bottom: 8px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            background-color: transparent;
            transition: background-color 0.2s;
        }

        .day-cell:active {
            background-color: #2c2c2e;
        }

        .day-cell.other-month {
            color: #48484a;
        }

        .day-cell.today {
            border: 1px solid #00FF22;
        }

        .day-cell.selected {
            background-color: #00FF22;
            color: #000;
            font-weight: 700;
        }

        .event-dot {
            width: 4px;
            height: 4px;
            background-color: #00FF22;
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
        }

        .day-cell.selected .event-dot {
            background-color: #000;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background-color: #00FF22;
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 34, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s ease;
        }

        .btn-main:active {
            opacity: 0.85;
        }

        .btn-secondary {
            background-color: #2c2c2e;
            color: #fff;
            box-shadow: none;
        }

        .agenda-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .agenda-item {
            background-color: #2c2c2e;
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #00FF22;
        }

        .agenda-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .agenda-title {
            font-weight: 600;
            font-size: 15px;
        }

        .agenda-time {
            font-size: 12px;
            color: #8e8e93;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 4px;
        }

        .input-group label {
            font-size: 11px;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .input-group input, .input-group select, .input-group textarea {
            background-color: #2c2c2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            user-select: text;
        }

        .tab-view {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .tab-view.active {
            display: flex;
        }
    
/* Pulsante Home in stile iOS */
.home-return{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10001;width:86px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(38,38,42,.76);color:#fff;text-decoration:none;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 4px 22px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.12);transition:transform .15s,background .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.home-return:active{transform:translateX(-50%) scale(.94);background:rgba(65,65,70,.9)}
.home-return svg{width:18px;height:18px;display:block}
/* Lascia spazio al controllo in basso ed evita che la pagina venga ingrandita automaticamente. */
body{padding-bottom:max(56px,calc(48px + env(safe-area-inset-bottom))) !important}
@media(hover:hover){.home-return:hover{background:rgba(65,65,70,.9)}}

</style>
</head>
<body>

    <div class="top-nav">
        <button class="nav-btn active" onclick="switchView('month')">Mese</button>
        <button class="nav-btn" onclick="switchView('week')">Settimana</button>
        <button class="nav-btn" onclick="switchView('day')">Giorno</button>
    </div>

    <div class="container">

        <!-- Vista Mese -->
        <div id="view-month" class="tab-view active">
            <div class="card">
                <div class="header-flex">
                    <button class="icon-btn" onclick="changeMonth(-1)">‹</button>
                    <div class="month-title" id="month-display">Ottobre 2026</div>
                    <button class="icon-btn" onclick="changeMonth(1)">›</button>
                </div>
                <div class="weekdays-grid">
                    <div>L</div><div>M</div><div>M</div><div>G</div><div>V</div><div>S</div><div>D</div>
                </div>
                <div class="days-grid" id="days-container"></div>
            </div>

            <button class="btn-main" onclick="openEventModal()">+ Nuovo Evento</button>

            <div class="card">
                <h3 style="font-size:15px; font-weight:600; margin-bottom:4px;" id="selected-date-title">Eventi del giorno</h3>
                <div class="agenda-list" id="month-agenda-list"></div>
            </div>
        </div>

        <!-- Vista Settimana -->
        <div id="view-week" class="tab-view">
            <div class="card">
                <div class="header-flex">
                    <button class="icon-btn" onclick="changeWeek(-1)">‹</button>
                    <div class="month-title" id="week-display">Settimana</div>
                    <button class="icon-btn" onclick="changeWeek(1)">›</button>
                </div>
                <div class="agenda-list" id="week-agenda-list"></div>
            </div>
        </div>

        <!-- Vista Giorno -->
        <div id="view-day" class="tab-view">
            <div class="card">
                <div class="header-flex">
                    <button class="icon-btn" onclick="changeDay(-1)">‹</button>
                    <div class="month-title" id="day-display">Oggi</div>
                    <button class="icon-btn" onclick="changeDay(1)">›</button>
                </div>
                <div class="agenda-list" id="day-agenda-list"></div>
            </div>
        </div>

    </div>

    <!-- Modale Nuovo Evento -->
    <div id="modal-event" class="modal">
        <div class="modal-content">
            <h3 style="text-align:center; font-size:16px;">Nuovo Evento</h3>
            <div class="input-group">
                <label>Titolo Evento</label>
                <input type="text" id="ev-title" placeholder="Es. Riunione, Compleanno">
            </div>
            <div class="input-group">
                <label>Data</label>
                <input type="date" id="ev-date">
            </div>
            <div class="input-group">
                <label>Ora</label>
                <input type="time" id="ev-time" value="09:00">
            </div>
            <div class="input-group">
                <label>Colore / Categoria</label>
                <select id="ev-color">
                    <option value="#00FF22">Verde Fluoro (Standard)</option>
                    <option value="#ff3b30">Rosso (Importante)</option>
                    <option value="#ffcc00">Giallo (Promemoria)</option>
                    <option value="#0a84ff">Blu (Lavoro/Studio)</option>
                </select>
            </div>
            <button class="btn-main" onclick="saveEvent()">Salva Evento</button>
            <button class="btn-main btn-secondary" onclick="closeModal()">Annulla</button>
        </div>
    </div>

    <script>
        let db;
        let currentDate = new Date();
        let selectedDate = new Date();
        let currentWeekOffset = 0;
        let currentDayOffset = 0;

        function initIndexedDB() {
            const request = indexedDB.open("CalendarDB", 1);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains("events")) {
                    db.createObjectStore("events", { keyPath: "id", autoIncrement: true });
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                renderCalendar();
                checkNotifications();
                setInterval(checkNotifications, 60000);
            };
        }

        function switchView(viewName) {
            document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            event.target.classList.add('active');

            if(viewName === 'month') renderCalendar();
            if(viewName === 'week') renderWeekView();
            if(viewName === 'day') renderDayView();
        }

        function renderCalendar() {
            if(!db) return;
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
            document.getElementById('month-display').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();
            
            const container = document.getElementById('days-container');
            container.innerHTML = '';

            const tx = db.transaction("events", "readonly");
            tx.objectStore("events").getAll().onsuccess = (e) => {
                const events = e.target.result;

                // Giorni mese precedente
                const prevDays = new Date(year, month, 0).getDate();
                for(let i = firstDayIndex; i > 0; i--) {
                    const dCell = document.createElement('div');
                    dCell.className = 'day-cell other-month';
                    dCell.innerText = prevDays - i + 1;
                    container.appendChild(dCell);
                }

                // Giorni mese corrente
                for(let i = 1; i <= totalDays; i++) {
                    const dCell = document.createElement('div');
                    dCell.className = 'day-cell';
                    dCell.innerText = i;

                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                    
                    const todayStr = new Date().toISOString().split('T')[0];
                    if(dateStr === todayStr) dCell.classList.add('today');
                    
                    const selStr = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth()+1).padStart(2,'0')}-${String(selectedDate.getDate()).padStart(2,'0')}`;
                    if(dateStr === selStr) dCell.classList.add('selected');

                    const hasEv = events.some(ev => ev.date === dateStr);
                    if(hasEv) {
                        const dot = document.createElement('div');
                        dot.className = 'event-dot';
                        dCell.appendChild(dot);
                    }

                    dCell.onclick = () => {
                        selectedDate = new Date(year, month, i);
                        renderCalendar();
                    };

                    container.appendChild(dCell);
                }

                renderMonthAgenda(events);
            };
        }

        function renderMonthAgenda(events) {
            const list = document.getElementById('month-agenda-list');
            list.innerHTML = '';

            const selStr = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth()+1).padStart(2,'0')}-${String(selectedDate.getDate()).padStart(2,'0')}`;
            document.getElementById('selected-date-title').innerText = `Eventi del ${selectedDate.toLocaleDateString('it-IT', {day:'numeric', month:'long'})}`;

            const filtered = events.filter(ev => ev.date === selStr);
            if(filtered.length === 0) {
                list.innerHTML = `<div style="font-size:13px; color:#8e8e93; text-align:center; padding:10px;">Nessun evento in questa data</div>`;
                return;
            }

            filtered.forEach(ev => {
                const item = document.createElement('div');
                item.className = 'agenda-item';
                item.style.borderLeftColor = ev.color || '#00FF22';
                item.innerHTML = `
                    <div class="agenda-info">
                        <span class="agenda-title">${ev.title}</span>
                        <span class="agenda-time">${ev.time}</span>
                    </div>
                    <button class="icon-btn" style="background:transparent; color:#ff3b30;" onclick="deleteEvent(${ev.id})">🗑️</button>
                `;
                list.appendChild(item);
            });
        }

        function changeMonth(dir) {
            currentDate.setMonth(currentDate.getMonth() + dir);
            renderCalendar();
        }

        function openEventModal() {
            const selStr = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth()+1).padStart(2,'0')}-${String(selectedDate.getDate()).padStart(2,'0')}`;
            document.getElementById('ev-date').value = selStr;
            document.getElementById('modal-event').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-event').style.display = 'none';
        }

        function saveEvent() {
            const title = document.getElementById('ev-title').value;
            const date = document.getElementById('ev-date').value;
            const time = document.getElementById('ev-time').value;
            const color = document.getElementById('ev-color').value;

            if(!title || !date) return;

            const tx = db.transaction("events", "readwrite");
            tx.objectStore("events").add({ title, date, time, color });
            tx.oncomplete = () => {
                closeModal();
                document.getElementById('ev-title').value = '';
                renderCalendar();
            };
        }

        function deleteEvent(id) {
            const tx = db.transaction("events", "readwrite");
            tx.objectStore("events").delete(id);
            tx.oncomplete = () => renderCalendar();
        }

        function renderWeekView() {
            if(!db) return;
            const list = document.getElementById('week-agenda-list');
            list.innerHTML = '';

            const now = new Date();
            now.setDate(now.getDate() + (currentWeekOffset * 7));
            document.getElementById('week-display').innerText = `Settimana del ${now.toLocaleDateString('it-IT', {day:'numeric', month:'short'})}`;

            const tx = db.transaction("events", "readonly");
            tx.objectStore("events").getAll().onsuccess = (e) => {
                const events = e.target.result;
                if(events.length === 0) {
                    list.innerHTML = `<div style="font-size:13px; color:#8e8e93; text-align:center; padding:10px;">Nessun evento programmato</div>`;
                    return;
                }
                events.forEach(ev => {
                    const item = document.createElement('div');
                    item.className = 'agenda-item';
                    item.style.borderLeftColor = ev.color || '#00FF22';
                    item.innerHTML = `
                        <div class="agenda-info">
                            <span class="agenda-title">${ev.title}</span>
                            <span class="agenda-time">${ev.date} - ${ev.time}</span>
                        </div>
                    `;
                    list.appendChild(item);
                });
            };
        }

        function changeWeek(dir) {
            currentWeekOffset += dir;
            renderWeekView();
        }

        function renderDayView() {
            if(!db) return;
            const list = document.getElementById('day-agenda-list');
            list.innerHTML = '';

            const target = new Date();
            target.setDate(target.getDate() + currentDayOffset);
            const targetStr = target.toISOString().split('T')[0];
            document.getElementById('day-display').innerText = target.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});

            const tx = db.transaction("events", "readonly");
            tx.objectStore("events").getAll().onsuccess = (e) => {
                const events = e.target.result.filter(ev => ev.date === targetStr);
                if(events.length === 0) {
                    list.innerHTML = `<div style="font-size:13px; color:#8e8e93; text-align:center; padding:10px;">Nessun evento per oggi</div>`;
                    return;
                }
                events.forEach(ev => {
                    const item = document.createElement('div');
                    item.className = 'agenda-item';
                    item.style.borderLeftColor = ev.color || '#00FF22';
                    item.innerHTML = `
                        <div class="agenda-info">
                            <span class="agenda-title">${ev.title}</span>
                            <span class="agenda-time">${ev.time}</span>
                        </div>
                    `;
                    list.appendChild(item);
                });
            };
        }

        function changeDay(dir) {
            currentDayOffset += dir;
            renderDayView();
        }

        function checkNotifications() {
            if(!db) return;
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const tx = db.transaction("events", "readonly");
            tx.objectStore("events").getAll().onsuccess = (e) => {
                const events = e.target.result;
                events.forEach(ev => {
                    if(ev.date === dateStr && ev.time === timeStr) {
                        if (Notification.permission === "granted") {
                            new Notification("Promemoria Evento", { body: ev.title });
                        }
                    }
                });
            };
        }

        window.onload = () => {
            initIndexedDB();
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        };
    </script>
