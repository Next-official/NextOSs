<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonGreen: '#00FF22',
                        darkBg: '#0B0B0D',
                        cardDark: '#16171B',
                        btnDark: '#202227',
                        btnSlate: '#2A2C32',
                        pillBg: '#141518'
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0B0B0D;
            color: #ffffff;
            overflow: hidden;
        }
        .neon-glow {
            box-shadow: 0 0 12px rgba(0, 255, 34, 0.4);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #editor-content {
            outline: none;
            user-select: text !important;
            -webkit-user-select: text !important;
            min-height: 100%;
        }
        #editor-content ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
        }
        #editor-content ol {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
        }
        #editor-content h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0.5rem;
            margin-bottom: 0.25rem;
            color: #ffffff;
        }
        #editor-content h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0.375rem;
            margin-bottom: 0.25rem;
            color: #f3f4f6;
        }
        #editor-content p {
            margin-bottom: 0.25rem;
        }
        #editor-content b, #editor-content strong {
            font-weight: 700;
            color: #ffffff;
        }
        #editor-content i, #editor-content em {
            font-style: italic;
        }
        #editor-content u {
            text-decoration: underline;
        }
        .fmt-btn {
            background-color: #202227;
            color: #d1d5db;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.6rem;
            padding: 0.4rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .fmt-btn:active {
            transform: scale(0.95);
            background-color: #2A2C32;
        }
    
/* Pulsante Home in stile iOS */
.home-return{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10001;width:86px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(38,38,42,.76);color:#fff;text-decoration:none;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 4px 22px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.12);transition:transform .15s,background .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.home-return:active{transform:translateX(-50%) scale(.94);background:rgba(65,65,70,.9)}
.home-return svg{width:18px;height:18px;display:block}
/* Lascia spazio al controllo in basso ed evita che la pagina venga ingrandita automaticamente. */
body{padding-bottom:max(56px,calc(48px + env(safe-area-inset-bottom))) !important}
@media(hover:hover){.home-return:hover{background:rgba(65,65,70,.9)}}

</style>
</head>
<body class="h-full flex flex-col max-w-md mx-auto relative bg-darkBg text-white px-3 pt-3 pb-4">

    <header class="w-full flex justify-center pb-2">
        <div class="bg-pillBg border border-white/5 px-4 py-1.5 rounded-full flex items-center justify-between w-full max-w-sm">
            <span class="text-[11px] font-bold tracking-widest text-neonGreen uppercase">le tue Note</span>
            <span id="header-count" class="text-[11px] font-medium text-gray-400">0 Note</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col w-full max-w-md relative overflow-hidden">

        <div id="screen-list" class="flex flex-col h-full space-y-3">
            <div class="flex items-center justify-between px-1 pt-1">
                <h1 class="text-2xl font-extrabold tracking-tight text-white">Note</h1>
                <button onclick="createNewNote()" class="bg-neonGreen text-black font-bold text-xs px-4 py-2.5 rounded-full shadow-lg active:scale-95 transition flex items-center gap-1.5 neon-glow">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    Nuova Nota
                </button>
            </div>

            <div id="notes-container" class="flex-1 overflow-y-auto no-scrollbar space-y-2.5 pr-0.5 pb-4"></div>
        </div>

        <div id="screen-editor" class="flex flex-col h-full space-y-2 hidden">
            <div class="flex items-center justify-between pt-1">
                <button onclick="closeEditor()" class="text-neonGreen text-xs font-semibold flex items-center gap-1 bg-cardDark border border-white/10 px-3 py-2 rounded-xl active:opacity-70 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                    Elenco
                </button>
                <div class="flex items-center gap-1.5">
                    <button onclick="copyNoteText()" class="text-neonGreen bg-cardDark px-2.5 py-2 rounded-xl text-xs font-medium border border-white/10 active:opacity-70 transition flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copia
                    </button>
                    <button onclick="clearCurrentNote()" class="text-yellow-400 bg-cardDark px-2.5 py-2 rounded-xl text-xs font-medium border border-white/10 active:opacity-70 transition">
                        Pulisci
                    </button>
                    <button onclick="deleteCurrentNote()" class="text-red-400 bg-cardDark px-2.5 py-2 rounded-xl text-xs font-medium border border-white/10 active:opacity-70 transition">
                        Elimina
                    </button>
                </div>
            </div>

            <input type="text" id="note-title" placeholder="Titolo nota..." oninput="onNoteInput()" class="w-full bg-cardDark text-white px-4 py-2.5 rounded-2xl font-bold text-lg border border-white/10 focus:outline-none focus:border-neonGreen/60 transition">

            <div class="bg-cardDark border border-white/10 rounded-2xl p-2 flex flex-wrap items-center justify-between gap-1">
                <div class="flex items-center gap-1">
                    <button onclick="execCmd('bold')" title="Grassetto" class="fmt-btn w-8 h-8 font-bold">B</button>
                    <button onclick="execCmd('italic')" title="Corsivo" class="fmt-btn w-8 h-8 italic">I</button>
                    <button onclick="execCmd('underline')" title="Sottolineato" class="fmt-btn w-8 h-8 underline">U</button>
                </div>

                <div class="flex items-center gap-1">
                    <button onclick="execCmd('insertUnorderedList')" title="Elenco Puntato" class="fmt-btn h-8 px-2 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16M2 6h.01M2 12h.01M2 18h.01"></path></svg>
                        •
                    </button>
                    <button onclick="execCmd('insertOrderedList')" title="Elenco Numerato" class="fmt-btn h-8 px-2 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 6h14M7 12h14M7 18h14M3 5v2m0 5v2m0 5v2"></path></svg>
                        1
                    </button>
                </div>

                <div class="flex items-center gap-1">
                    <button onclick="execCmd('formatBlock', '<h1>')" title="Titolo Grande" class="fmt-btn h-8 px-2 font-bold text-xs">H1</button>
                    <button onclick="execCmd('formatBlock', '<h2>')" title="Sottotitolo" class="fmt-btn h-8 px-2 font-bold text-xs">H2</button>
                    <button onclick="execCmd('formatBlock', '<p>')" title="Testo Normale" class="fmt-btn h-8 px-2 text-xs">P</button>
                </div>

                <div class="flex items-center gap-1">
                    <button onclick="execCmd('justifyLeft')" title="Sinistra" class="fmt-btn w-8 h-8">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h10M4 18h14"></path></svg>
                    </button>
                    <button onclick="execCmd('justifyCenter')" title="Centro" class="fmt-btn w-8 h-8">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M7 12h10M5 18h14"></path></svg>
                    </button>
                </div>
            </div>

            <div class="flex-1 bg-cardDark border border-white/10 rounded-2xl p-4 overflow-y-auto no-scrollbar relative flex flex-col">
                <div id="editor-content" contenteditable="true" oninput="onNoteInput()" class="flex-1 text-white text-base leading-relaxed focus:outline-none"></div>
            </div>

            <div class="bg-cardDark border border-white/10 rounded-2xl px-4 py-2 flex items-center justify-between text-xs font-mono">
                <div class="flex items-center gap-4">
                    <span class="text-gray-400">Parole: <strong id="word-count" class="text-neonGreen font-semibold">0</strong></span>
                    <span class="text-gray-400">Caratteri: <strong id="char-count" class="text-neonGreen font-semibold">0</strong></span>
                </div>
                <span id="save-status" class="text-[10px] text-gray-500 uppercase tracking-widest">Salvato</span>
            </div>
        </div>

    </main>

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-btnSlate border border-neonGreen/50 text-white px-4 py-2 rounded-full text-xs shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50">
        Messaggio
    </div>

    <script>
        const DB_NAME = 'iPhoneNotesDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'notes';
        let db = null;
        let currentNoteId = null;
        let saveTimeout = null;

        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };

                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };

                request.onerror = (e) => {
                    reject(e);
                };
            });
        }

        function getAllNotesFromDB() {
            return new Promise((resolve) => {
                if (!db) return resolve([]);
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.getAll();

                request.onsuccess = () => {
                    resolve(request.result || []);
                };
                request.onerror = () => {
                    resolve([]);
                };
            });
        }

        function saveNoteToDB(note) {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put(note);
                tx.oncomplete = () => resolve();
            });
        }

        function deleteNoteFromDB(id) {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(id);
                tx.oncomplete = () => resolve();
            });
        }

        async function initApp() {
            try {
                await initIndexedDB();
                await renderNotesList();
            } catch (err) {
                console.error(err);
            }
        }

        async function renderNotesList() {
            const container = document.getElementById('notes-container');
            const notes = await getAllNotesFromDB();
            
            document.getElementById('header-count').innerText = `${notes.length} ${notes.length === 1 ? 'Nota' : 'Note'}`;
            container.innerHTML = '';

            if (notes.length === 0) {
                container.innerHTML = `
                    <div class="h-64 flex flex-col items-center justify-center text-center p-6 border border-dashed border-white/10 rounded-3xl space-y-3">
                        <svg class="w-10 h-10 text-gray-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path></svg>
                        <p class="text-sm font-medium text-gray-400">Nessuna nota salvata</p>
                        <p class="text-xs text-gray-600">Tocca "Nuova Nota" per iniziare a scrivere</p>
                    </div>
                `;
                return;
            }

            notes.sort((a, b) => b.updatedAt - a.updatedAt);

            notes.forEach(note => {
                const titleText = note.title.trim() || 'Nota senza titolo';
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = note.body;
                const plainText = tempDiv.innerText.trim() || 'Nessun contenuto';

                const dateObj = new Date(note.updatedAt);
                const dateStr = dateObj.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

                const card = document.createElement('div');
                card.className = 'bg-cardDark border border-white/10 rounded-2xl p-4 flex items-center justify-between cursor-pointer active:scale-[0.98] transition group';
                card.onclick = () => openNoteEditor(note.id);
                card.innerHTML = `
                    <div class="flex flex-col space-y-1.5 flex-1 min-w-0 pr-3">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-base text-white truncate max-w-[180px]">${escapeHtml(titleText)}</h3>
                            <span class="text-[10px] text-gray-500 font-mono">${dateStr}</span>
                        </div>
                        <p class="text-xs text-gray-400 truncate leading-relaxed">${escapeHtml(plainText)}</p>
                    </div>
                    <button onclick="quickDeleteNote(event, '${note.id}')" title="Elimina Nota" class="p-2 text-gray-500 hover:text-red-400 active:scale-90 transition rounded-xl">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        async function createNewNote() {
            const newNote = {
                id: Date.now().toString(),
                title: '',
                body: '',
                updatedAt: Date.now()
            };
            await saveNoteToDB(newNote);
            openNoteEditor(newNote.id);
        }

        async function openNoteEditor(noteId) {
            currentNoteId = noteId;
            const notes = await getAllNotesFromDB();
            const note = notes.find(n => n.id === noteId);
            if (!note) return;

            document.getElementById('note-title').value = note.title || '';
            document.getElementById('editor-content').innerHTML = note.body || '';

            document.getElementById('screen-list').classList.add('hidden');
            document.getElementById('screen-editor').classList.remove('hidden');

            updateWordAndCharCount();
            setSaveStatus("Salvato", false);
        }

        async function closeEditor() {
            clearTimeout(saveTimeout);
            await saveCurrentNoteImmediate();
            currentNoteId = null;
            document.getElementById('screen-editor').classList.add('hidden');
            document.getElementById('screen-list').classList.remove('hidden');
            renderNotesList();
        }

        function onNoteInput() {
            updateWordAndCharCount();
            setSaveStatus("aggiorno", true);

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveCurrentNoteImmediate();
            }, 300);
        }

        async function saveCurrentNoteImmediate() {
            if (!currentNoteId) return;
            const title = document.getElementById('note-title').value;
            const body = document.getElementById('editor-content').innerHTML;
            
            const note = {
                id: currentNoteId,
                title: title,
                body: body,
                updatedAt: Date.now()
            };
            
            await saveNoteToDB(note);
            setSaveStatus("Salvato", false);
        }

        async function deleteCurrentNote() {
            if (!currentNoteId) return;
            clearTimeout(saveTimeout);
            const idToDelete = currentNoteId;
            currentNoteId = null; 
            
            await deleteNoteFromDB(idToDelete);
            showToast("Nota eliminata");
            
            document.getElementById('screen-editor').classList.add('hidden');
            document.getElementById('screen-list').classList.remove('hidden');
            renderNotesList();
        }

        async function quickDeleteNote(event, id) {
            event.stopPropagation();
            await deleteNoteFromDB(id);
            showToast("Nota eliminata");
            renderNotesList();
        }

        function clearCurrentNote() {
            document.getElementById('note-title').value = '';
            document.getElementById('editor-content').innerHTML = '';
            onNoteInput();
            showToast("Testo pulito");
        }

        function copyNoteText() {
            const title = document.getElementById('note-title').value;
            const editor = document.getElementById('editor-content');
            const plainBody = editor.innerText || '';
            
            const fullText = `${title}\n\n${plainBody}`.trim();
            if (!fullText) {
                showToast("Nessun testo da copiare");
                return;
            }

            const tempInput = document.createElement("textarea");
            tempInput.value = fullText;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            showToast("Copiato negli appunti");
        }

        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('editor-content').focus();
            onNoteInput();
        }

        function updateWordAndCharCount() {
            const editor = document.getElementById('editor-content');
            const text = editor.innerText || editor.textContent || '';
            
            const charCount = text.length;
            const trimmedText = text.trim();
            const wordCount = trimmedText === '' ? 0 : trimmedText.split(/\s+/).length;

            document.getElementById('char-count').innerText = charCount;
            document.getElementById('word-count').innerText = wordCount;
        }

        function setSaveStatus(msg, isSaving) {
            const status = document.getElementById('save-status');
            status.innerText = msg;
            if (isSaving) {
                status.classList.add('text-neonGreen');
            } else {
                status.classList.remove('text-neonGreen');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 1800);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = initApp;
    </script>
